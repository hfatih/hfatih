<svg xmlns="http://www.w3.org/2000/svg" width="172" height="40" viewBox="0 0 172 40" role="img" aria-label="Join my Discord"><style>@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}.tw{animation:tw 3.2s ease-in-out infinite}@keyframes fall{0%{transform:translate(0,0);opacity:0}8%{opacity:.9}22%{transform:translate(-190px,95px);opacity:0}100%{opacity:0}}.fall{animation:fall 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin linear infinite}@media(prefers-reduced-motion:reduce){.tw,.fall,.spin{animation:none}}@keyframes shine{0%,70%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(262px) skewX(-20deg)}}.shine{animation:shine 4.5s ease-in infinite}@media(prefers-reduced-motion:reduce){.shine{animation:none}}</style><defs><linearGradient id="fill" x1="0" x2="1"><stop offset="0" stop-color="#ffd3e0"/><stop offset="1" stop-color="#e7a0b9"/></linearGradient><clipPath id="pill"><rect width="172" height="40" rx="20"/></clipPath></defs><rect width="172" height="40" rx="20" fill="url(#fill)"/><g clip-path="url(#pill)"><rect class="shine" x="-40" y="0" width="26" height="40" fill="#fff" opacity=".45" transform="skewX(-20)"/></g><path d="M24 13L25.26 18.74 31 20 25.26 21.26 24 27 22.74 21.26 17 20 22.74 18.74Z" fill="#8e3a5b" opacity="1.00" class="tw"/><text x="40" y="25" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#24121c">Join my Discord</text></svg>
