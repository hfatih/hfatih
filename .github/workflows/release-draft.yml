name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (for example v1.0; preserve the current version/channel)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  source-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_build

  draft:
    needs: source-tests
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a version such as v1.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
          # source-tests checks this SHA directly; the draw workflow commits generated assets.
      - name: Generate release notes and create a draft
        shell: bash
        run: |
          set -euo pipefail
          # A draft keeps publication, version acceptance and installer uploads deliberate.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "Prepared draft ${TAG} from ${GITHUB_SHA}. Review the notes and platform acceptance before publishing." >> "$GITHUB_STEP_SUMMARY"
